<!doctype html>
<html>
  <head>
    <link rel="stylesheet" href="Bootstrap/css/bootstrap.min.css" />
    <link
      rel="stylesheet"
      href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
    />
    <title>Admin</title>
  </head>
  <body>
    <div class="g-3 container-md container mt-5 card shadow p-4">
      <h2 class="mb-4 text-center">Admin Dashboard</h2>
      <button
        id="themeToggle"
        class="btn btn-outline-secondary ms-2"
        type="button"
        aria-label="Toggle theme"
      >
        <i class="bi bi-moon-fill"></i>
      </button>

      <form id="articleForm">
        <!-- Title -->
        <div class="mb-3">
          <label for="title" class="form-label">Title</label>
          <input type="text" class="form-control" id="title" required />
        </div>

        <!-- Category -->
        <div class="mb-3">
          <label for="category" class="form-label">Category</label>

          <select class="form-select" id="category" required>
            <option value="">Select Category</option>
            <option value="global">Global</option>
            <option value="national">National</option>
            <option value="sports">Sports</option>
            <option value="business">Business</option>
            <option value="politics">Politics</option>
            <option value="drama">Drama</option>
          </select>
        </div>

        <!-- Author -->
        <div class="mb-3">
          <label for="author" class="form-label">Author</label>
          <input type="text" class="form-control" id="author" required />
        </div>

        <!-- Image -->
        <div class="mb-3">
          <label for="image" class="form-label">Image URL</label>
          <input class="form-control" id="image" required />
        </div>

        <!-- Excerpt -->
        <div class="mb-3">
          <label for="excerpt" class="form-label">Excerpt</label>
          <textarea
            class="form-control"
            id="excerpt"
            rows="4"
            required
          ></textarea>
        </div>

        <!-- Article Body -->
        <div class="mb-3">
          <label for="body" class="form-label">Article Body</label>
          <textarea
            class="form-control"
            id="body"
            rows="10"
            placeholder="Write the complete article here.Leave one blank line between paragraphs."
            required
          ></textarea>
        </div>

        <!-- Date -->
        <div class="mb-3">
          <label for="date" class="form-label">Date</label>
          <input type="date" class="form-control" id="date" required />
        </div>

        <!-- Read Time -->
        <div class="mb-3">
          <label for="readTime" class="form-label">Read Time</label>
          <input
            type="text"
            class="form-control"
            id="readTime"
            placeholder="5 min read"
            required
          />
        </div>

        <!-- Featured -->
        <div class="form-check mb-3">
          <input class="form-check-input" type="checkbox" id="featured" />
          <label class="form-check-label" for="featured">
            Featured Article
          </label>
        </div>

        <!-- Keywords -->
        <div class="mb-4">
          <label for="keywords" class="form-label">
            Keywords (comma separated)
          </label>

          <input
            type="text"
            class="form-control"
            id="keywords"
            placeholder="AI, Technology, Google"
          />
        </div>

        <button type="submit" class="btn btn-primary w-100">
          Publish Article
        </button>
      </form>

      <hr class="my-5" />
      <h3 class="mb-3">Existing Articles</h3>
      <div class="table-responsive">
        <table class="table table-striped table-hover">
          <thead class="table-dark">
            <tr>
              <th>ID</th>
              <th>Title</th>
              <th>Category</th>
              <th>Author</th>
              <th>Actions</th>
            </tr>
          </thead>
          <tbody id="articlesTableBody"></tbody>
        </table>
      </div>
    </div>
    <script type="module" src="js/admin.js"></script>
    <script src="assets/js/darkmodetoggle.js"></script>
    <script src="Bootstrap/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
